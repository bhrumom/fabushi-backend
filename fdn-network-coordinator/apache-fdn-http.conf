<VirtualHost *:80>
    ServerName fdn.ombhrum.com
    DocumentRoot /var/www/fabushi-fdn-acme
    <Directory /var/www/fabushi-fdn-acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    LogFormat "%t %m %>s %D" fdn_http_minimal
    CustomLog ${APACHE_LOG_DIR}/fabushi-fdn-http.log fdn_http_minimal
    ErrorLog ${APACHE_LOG_DIR}/fabushi-fdn-error.log
</VirtualHost>
