<VirtualHost *:9443>
    ServerName fdn.ombhrum.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/fdn.ombhrum.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/fdn.ombhrum.com/privkey.pem
    ProxyPreserveHost On
    ProxyTimeout 900
    RequestHeader unset True-Client-IP
    RequestHeader unset X-Real-IP
    RequestHeader unset X-Forwarded-For
    <LocationMatch "^/(api|metrics|debug|swagger)(/|$)">
        Require all denied
    </LocationMatch>
    ProxyPass / http://127.0.0.1:8080/ upgrade=any timeout=900
    ProxyPassReverse / http://127.0.0.1:8080/
    LogFormat "%t %m %>s %D" fdn_tls_minimal
    CustomLog ${APACHE_LOG_DIR}/fabushi-fdn-access.log fdn_tls_minimal
    ErrorLog ${APACHE_LOG_DIR}/fabushi-fdn-error.log
</VirtualHost>
