<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Mahayana global sharing web app">
  <meta name="color-scheme" content="dark">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mahayana">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Mahayana</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09070b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    #instant-shell {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
      box-sizing: border-box;
      color: white;
      background: linear-gradient(180deg, #0b1026 0%, #09070b 100%);
      transition: opacity 180ms ease;
    }

    #instant-shell.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .instant-panel {
      width: min(520px, 100%);
      text-align: left;
    }

    .instant-title {
      margin: 0 0 14px;
      font-size: clamp(42px, 9vw, 68px);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: 0.02em;
    }

    .instant-copy {
      margin: 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: clamp(18px, 3vw, 22px);
      line-height: 1.42;
      font-weight: 650;
    }

    .instant-status {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: 30px;
      color: rgba(255, 255, 255, 0.52);
      font-size: 14px;
    }

    .instant-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-top-color: rgba(255, 255, 255, 0.82);
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var shell = document.getElementById('instant-shell');
      if (!shell) return;
      shell.classList.add('hidden');
      setTimeout(function () {
        if (shell && shell.parentNode) shell.parentNode.removeChild(shell);
      }, 220);
    });
  </script>
</head>

<body>
  <div id="instant-shell" aria-live="polite">
    <main class="instant-panel">
      <h1 class="instant-title">Mahayana</h1>
      <p class="instant-copy">A fast first screen for global sharing.</p>
      <div class="instant-status">
        <span class="instant-spinner" aria-hidden="true"></span>
        <span>Opening the app...</span>
      </div>
    </main>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
