name = "fabushi-flutter-web"
main = "worker-modular.js"
compatibility_date = "2024-08-01"

[[services]]
binding = "MAHAYANA_PLATFORM"
service = "mahayana-platform"

[[kv_namespaces]]
binding = "USERS_KV"
id = "20bc68276a0345ab9b5cbf17c1bd51c5"
preview_id = "6b219f4753b944f4a74043f385497c3b"

[[kv_namespaces]]
binding = "ORDERS_KV"
id = "94534f35a0a34023a428a065f77f1911"
preview_id = "preview_orders_kv"

[[kv_namespaces]]
binding = "MEMBERSHIP_KV"
id = "773e778850ea429d99686ff4fbbe1180"
preview_id = "preview_membership_kv"

[[kv_namespaces]]
binding = "REDEEM_CODES_KV"
id = "59c5263942b4436191e6dffbaacc5957"
preview_id = "preview_redeem_codes_kv"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "bushi"
preview_bucket_name = "bushi"

[[durable_objects.bindings]]
name = "ONLINE_COUNTER"
class_name = "OnlineCounter"
script_name = "fabushi-flutter-web"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OnlineCounter"]

[[d1_databases]]
binding = "DB"
database_name = "fabushi-db"
database_id = "7b6318f0-fbc2-42f9-9887-85f878ae76d0"

[[d1_databases]]
binding = "PLATFORM_DB"
database_name = "mahayana-platform"
database_id = "24e53e28-5abd-4850-ae99-cd5d2bdfffb0"
migrations_dir = "../../third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations"

[vars]
FROM_EMAIL = "amitabha@ombhrum.com"
# Security-sensitive values such as JWT_SECRET, ALIPAY_PRIVATE_KEY,
# AUTH_PROVIDER_BRIDGE_SECRET and provider credentials MUST be configured with
# `wrangler secret put` / environment secrets, never committed here.
BACKEND_ONLY = "true"
FRONTEND_URL = "https://flutter.ombhrum.com"
DACHENG_AI_BACKEND_URL = "https://ai.ombhrum.com"
DACHENG_RESPONSES_ADAPTER_URL = "https://dacheng-responses-adapter.bhrumom.workers.dev"

[env.production]
name = "fabushi-flutter-web-prod"
routes = [
  { pattern = "api.ombhrum.com", custom_domain = true }
]
workers_dev = false

[[env.production.services]]
binding = "MAHAYANA_PLATFORM"
service = "mahayana-platform"

[[env.production.kv_namespaces]]
binding = "USERS_KV"
id = "20bc68276a0345ab9b5cbf17c1bd51c5"

[[env.production.kv_namespaces]]
binding = "ORDERS_KV"
id = "94534f35a0a34023a428a065f77f1911"

[[env.production.kv_namespaces]]
binding = "MEMBERSHIP_KV"
id = "773e778850ea429d99686ff4fbbe1180"

[[env.production.kv_namespaces]]
binding = "REDEEM_CODES_KV"
id = "59c5263942b4436191e6dffbaacc5957"

[[env.production.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "bushi"

[[env.production.d1_databases]]
binding = "DB"
database_name = "fabushi-db"
database_id = "7b6318f0-fbc2-42f9-9887-85f878ae76d0"

[[env.production.d1_databases]]
binding = "PLATFORM_DB"
database_name = "mahayana-platform"
database_id = "24e53e28-5abd-4850-ae99-cd5d2bdfffb0"
migrations_dir = "../../third_party/mahayana/mahayana-rs/mahayana-platform-worker/migrations"

[[env.production.durable_objects.bindings]]
name = "ONLINE_COUNTER"
class_name = "OnlineCounter"
script_name = "fabushi-flutter-web-prod"

[env.production.vars]
FROM_EMAIL = "amitabha@ombhrum.com"
BACKEND_ONLY = "true"
ALIPAY_APP_ID = "2021005193647715"
ALIPAY_PUBLIC_KEY = ""
WORKER_URL = "https://api.ombhrum.com"
FRONTEND_URL = "https://flutter.ombhrum.com"
DACHENG_AI_BACKEND_URL = "https://ai.ombhrum.com"
DACHENG_RESPONSES_ADAPTER_URL = "https://dacheng-responses-adapter.bhrumom.workers.dev"
ALIPAY_MOBILE_AUTH_REDIRECT_URL = "https://api.ombhrum.com/api/auth/alipay/callback"
ALIPAY_NOTIFY_URL = "https://api.ombhrum.com/api/alipay/notify"
ALIPAY_RETURN_URL = "https://flutter.ombhrum.com/payment-success.html"

[env.development]
