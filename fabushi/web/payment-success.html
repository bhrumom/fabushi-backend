<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付成功</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
            position: relative;
            overflow: hidden;
        }
        
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4CAF50, #8BC34A, #CDDC39);
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: #4CAF50;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            position: relative;
            animation: pulse 2s infinite;
        }
        
        .success-icon::before {
            content: '✓';
            color: white;
            font-size: 40px;
            font-weight: bold;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        h1 {
            color: #333;
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 600;
        }
        
        p {
            color: #666;
            margin: 0 0 20px 0;
            font-size: 16px;
            line-height: 1.5;
        }
        
        .countdown {
            font-size: 18px;
            color: #4CAF50;
            font-weight: 600;
            margin: 20px 0;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #f0f0f0;
            border-radius: 2px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            border-radius: 2px;
            transition: width 0.3s ease;
            width: 100%;
        }
        
        .close-hint {
            font-size: 14px;
            color: #999;
            margin-top: 15px;
            font-style: italic;
        }
        
        .manual-close {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }
        
        .manual-close:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container fade-in">
        <div class="success-icon"></div>
        <h1 id="title">正在确认支付</h1>
        <p id="message">支付平台正在返回结果，请稍候。</p>
        <div class="countdown" id="countdown">正在查询支付状态…</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="close-hint" id="hint">确认成功后页面会自动关闭。</p>
        <button class="manual-close" onclick="closeWindow()">关闭页面</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const paymentId = params.get('paymentId') || '';
        const checkoutToken = params.get('checkoutToken') || '';
        const cancelled = params.get('cancelled') === '1';
        const countdownElement = document.getElementById('countdown');
        const progressFill = document.getElementById('progressFill');

        function notifyParent(action, message) {
            const payload = { action, paymentId, message };
            try {
                if (window.opener && !window.opener.closed) window.opener.postMessage(payload, window.location.origin);
                if (window.parent && window.parent !== window) window.parent.postMessage(payload, window.location.origin);
                localStorage.setItem('paymentStatus', JSON.stringify({ ...payload, timestamp: Date.now() }));
            } catch (error) {
                console.warn('无法通知支付发起页面:', error);
            }
        }

        function setState(title, message, hint, color = '#4CAF50') {
            document.getElementById('title').textContent = title;
            document.getElementById('message').textContent = message;
            document.getElementById('hint').textContent = hint;
            document.querySelector('.success-icon').style.background = color;
        }

        function closeWindow() {
            try {
                window.close();
            } catch (error) {
                console.warn('无法自动关闭页面:', error);
            }
        }

        function startCloseCountdown() {
            let remaining = 3;
            const interval = setInterval(() => {
                remaining -= 1;
                countdownElement.textContent = remaining > 0 ? `${remaining} 秒后自动关闭` : '可以关闭页面了';
                progressFill.style.width = `${Math.max(0, (remaining / 3) * 100)}%`;
                if (remaining <= 0) {
                    clearInterval(interval);
                    closeWindow();
                }
            }, 1000);
        }

        async function readPaymentStatus() {
            if (!paymentId || !checkoutToken) {
                setState('无法确认支付', '支付回调缺少安全校验信息，请返回应用查看订单状态。', '未确认成功，不会重复扣款。', '#9E9E9E');
                countdownElement.textContent = '请手动关闭页面';
                return;
            }
            if (cancelled) {
                setState('支付未完成', '本次支付已取消或尚未完成。', '如需支付，请返回应用重新发起。', '#9E9E9E');
                countdownElement.textContent = '请手动关闭页面';
                notifyParent('paymentCancelled', '支付未完成');
                return;
            }

            const endpoint = `/api/pay/status?paymentId=${encodeURIComponent(paymentId)}&checkoutToken=${encodeURIComponent(checkoutToken)}`;
            for (let attempt = 0; attempt < 30; attempt += 1) {
                try {
                    const response = await fetch(endpoint, { cache: 'no-store', credentials: 'same-origin' });
                    if (response.ok) {
                        const result = await response.json();
                        if (['succeeded', 'partially_refunded', 'refunded'].includes(result.status)) {
                            setState('支付成功！', '订单已确认，权益正在同步。', '页面即将自动关闭。');
                            countdownElement.textContent = '3 秒后自动关闭';
                            notifyParent('paymentSuccess', '支付成功！');
                            startCloseCountdown();
                            return;
                        }
                        if (['failed', 'cancelled'].includes(result.status)) {
                            setState('支付未完成', '支付平台没有确认成功。', '如需支付，请返回应用重新发起。', '#9E9E9E');
                            countdownElement.textContent = '请手动关闭页面';
                            notifyParent('paymentFailed', '支付未完成');
                            return;
                        }
                    }
                } catch (error) {
                    console.warn('查询支付状态失败:', error);
                }
                countdownElement.textContent = `正在确认支付（${attempt + 1}/30）…`;
                await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            setState('支付处理中', '支付平台暂时还没有返回最终结果。', '请返回应用稍后查看订单状态，不要重复支付。', '#FF9800');
            countdownElement.textContent = '请手动关闭页面';
            notifyParent('paymentPending', '支付仍在确认中');
        }

        readPaymentStatus();
    </script>
</body>
</html>
