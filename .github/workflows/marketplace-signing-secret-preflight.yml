name: Marketplace Signing Secret Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-signing-secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN || secrets.WRANGLER_API_TOKEN || secrets.CLOUDFLARE_TOKEN || secrets.CF_TOKEN || vars.CLOUDFLARE_API_TOKEN || vars.CF_API_TOKEN || vars.WRANGLER_API_TOKEN || vars.CLOUDFLARE_TOKEN || vars.CF_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID || secrets.CF_ACCOUNT || secrets.CLOUDFLARE_ACCOUNT || vars.CLOUDFLARE_ACCOUNT_ID || vars.CF_ACCOUNT_ID || vars.CF_ACCOUNT || vars.CLOUDFLARE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify exact source SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Verify existing production Worker secrets
        working-directory: fabushi/web
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          secrets_json="$(npx --yes wrangler@4 secret list --env production --format json)"
          for name in             FABUSHI_MARKETPLACE_SIGNING_PRIVATE_KEY             FABUSHI_MARKETPLACE_SIGNING_PUBLIC_KEY_RAW             FABUSHI_MARKETPLACE_SIGNING_KEY_ID             FABUSHI_MARKETPLACE_TRUST_EPOCH             FABUSHI_MARKETPLACE_REVIEW_TOKEN
          do
            jq -e --arg name "$name" '.[] | select(.name == $name)' <<<"$secrets_json" >/dev/null || {
              echo "Missing production Worker secret: $name" >&2
              exit 1
            }
          done
