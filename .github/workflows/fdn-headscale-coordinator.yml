name: FDN Headscale coordinator

on:
  pull_request:
    paths:
      - "fdn-network-coordinator/**"
      - ".github/workflows/fdn-headscale-coordinator.yml"
  push:
    branches: [main]
    paths:
      - "fdn-network-coordinator/**"
      - ".github/workflows/fdn-headscale-coordinator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Bind exact tested HEAD
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            expected="${{ github.event.pull_request.head.sha }}"
          else
            expected="${{ github.sha }}"
          fi
          test "$actual" = "$expected"
      - name: Render CI configuration
        working-directory: fdn-network-coordinator
        shell: bash
        env:
          FABUSHI_FDN_HEADSCALE_SERVER_URL: https://fdn-ci.example.invalid
        run: bash ./render-config.sh
      - name: Enforce fail-closed policy and exact version
        working-directory: fdn-network-coordinator
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'image: docker.io/headscale/headscale:0.29.5' docker-compose.yml
          grep -F '"grants": []' policy.hujson
          grep -F '"grants": []' runtime/policy.hujson
          grep -F 'path: /etc/headscale/fdn-runtime/policy.hujson' runtime/config.yaml
          grep -F './runtime:/etc/headscale/fdn-runtime:ro' docker-compose.yml
          if grep -Fq './policy.hujson:/etc/headscale/policy.hujson' docker-compose.yml; then
            exit 1
          fi
          grep -F 'verify_clients: true' runtime/config.yaml
          grep -F 'urls: []' runtime/config.yaml
          grep -F 'magic_dns: false' runtime/config.yaml
          if grep -Eq 'headscale:(latest|stable|main)' docker-compose.yml; then
            exit 1
          fi
      - name: Test Core-driven policy projection
        working-directory: fdn-network-coordinator
        shell: bash
        run: |
          set -euo pipefail
          node --test ./project-core-policy.test.mjs
          node --input-type=module - <<'NODE'
          import { writeFile } from "node:fs/promises";
          import { buildHeadscalePolicy } from "./project-core-policy.mjs";
          const policy = buildHeadscalePolicy([
            {
              userId: "user:ci",
              deviceId: "device-ci",
              cellId: "cell-fdn-ci",
              nodeId: "100.64.0.10",
              generation: 1,
              expiresAt: 4102444800,
            },
          ]);
          await writeFile("runtime/projected-policy.hujson", JSON.stringify(policy, null, 2) + "\n");
          NODE
          grep -F '"src": [' runtime/projected-policy.hujson
          grep -F '"dst": [' runtime/projected-policy.hujson
          grep -F '"tcp:8792"' runtime/projected-policy.hujson
          if grep -Eiq 'deviceSecret|proofSha256|accessToken|refreshToken|clientToken|mobileToken' runtime/projected-policy.hujson; then
            exit 1
          fi
      - name: Test Core to Headscale enrollment binding
        working-directory: fdn-network-coordinator
        shell: bash
        run: |
          set -euo pipefail
          node --test ./enrollment-broker.test.mjs
          node --check ./enrollment-broker.mjs
          node --input-type=module - <<'NODE'
          import { readFile } from "node:fs/promises";
          const source = await readFile("enrollment-broker.mjs", "utf8");
          for (const required of [
            "/v1/internal/computers/network-enrollment-grants/redeem",
            "/v1/internal/computers/network-bindings/bind",
            "/v1/internal/computers/network-bindings/cell-snapshot",
            "preAuthKey?.id",
            "redeem_outcome_unknown",
            "bind_outcome_unknown",
            "aes-256-gcm",
          ]) {
            if (!source.includes(required)) throw new Error(`missing enrollment invariant: ${required}`);
          }
          for (const forbidden of ["registerDeviceTools", "devices registry", "headscale:latest"]) {
            if (source.includes(forbidden)) throw new Error(`forbidden enrollment authority: ${forbidden}`);
          }
          NODE
      - name: Test loopback enrollment service boundary
        working-directory: fdn-network-coordinator
        shell: bash
        run: |
          set -euo pipefail
          node --test ./enrollment-service.test.mjs
          node --check ./enrollment-service.mjs
          grep -F 'host !== "127.0.0.1" && host !== "::1"' enrollment-service.mjs
          grep -F 'FABUSHI_FDN_ENROLLMENT_BROKER_TOKEN' enrollment-service.mjs
          if grep -Eiq 'registerDeviceTools|devices registry|headscale:latest' enrollment-service.mjs; then
            exit 1
          fi
      - name: Validate enrollment service supervisor
        working-directory: fdn-network-coordinator
        shell: bash
        run: |
          set -euo pipefail
          bash -n ./run-enrollment-service.sh
          grep -F 'User=fabushi-fdn' systemd/fabushi-fdn-enrollment.service
          grep -F 'Group=fabushi-fdn' systemd/fabushi-fdn-enrollment.service
          grep -F 'UMask=0077' systemd/fabushi-fdn-enrollment.service
          grep -F 'NoNewPrivileges=true' systemd/fabushi-fdn-enrollment.service
          grep -F 'ProtectSystem=strict' systemd/fabushi-fdn-enrollment.service
          grep -F 'PrivateDevices=true' systemd/fabushi-fdn-enrollment.service
          grep -F 'StateDirectory=fabushi-fdn' systemd/fabushi-fdn-enrollment.service
          grep -F 'StateDirectoryMode=0700' systemd/fabushi-fdn-enrollment.service
          grep -F 'ReadWritePaths=/var/lib/fabushi-fdn' systemd/fabushi-fdn-enrollment.service
          grep -F 'umask 077' run-enrollment-service.sh
          grep -F 'unix:///run/user/*/docker.sock' run-enrollment-service.sh
          if grep -Fq 'DOCKER_HOST=unix:///var/run/docker.sock' run-enrollment-service.sh enrollment.env.example systemd/fabushi-fdn-enrollment.service; then
            echo "rootful Docker socket must not be configured" >&2
            exit 1
          fi
          secret='012345678901234567890123456789012345678901234567'
          set +e
          output="$(
            FDN_NETWORK_AUTHORITY_TOKEN="$secret" \
            FABUSHI_FDN_ENROLLMENT_BROKER_TOKEN="$secret" \
            FABUSHI_FDN_ENROLLMENT_STATE_KEY_B64="$secret" \
            FABUSHI_PLATFORM_CORE_URL='https://core.example.invalid' \
            FABUSHI_FDN_ENROLLMENT_LISTEN_HOST='0.0.0.0' \
            DOCKER_HOST='unix:///run/user/1000/docker.sock' \
            bash ./run-enrollment-service.sh 2>&1
          )"
          status=$?
          set -e
          test "$status" -eq 64
          grep -F 'enrollment service must remain loopback-only' <<<"$output"

          set +e
          output="$(
            FDN_NETWORK_AUTHORITY_TOKEN="$secret" \
            FABUSHI_FDN_ENROLLMENT_BROKER_TOKEN="$secret" \
            FABUSHI_FDN_ENROLLMENT_STATE_KEY_B64="$secret" \
            FABUSHI_PLATFORM_CORE_URL='https://core.example.invalid' \
            FABUSHI_FDN_ENROLLMENT_LISTEN_HOST='127.0.0.1' \
            DOCKER_HOST='unix:///var/run/docker.sock' \
            bash ./run-enrollment-service.sh 2>&1
          )"
          status=$?
          set -e
          test "$status" -eq 64
          grep -F 'dedicated rootless Docker unix socket' <<<"$output"
      - name: Validate policy sync ordering
        working-directory: fdn-network-coordinator
        shell: bash
        run: |
          set -euo pipefail
          bash -n ./sync-core-policy.sh
          node --input-type=module - <<'NODE'
          import { readFile } from "node:fs/promises";
          const source = await readFile("sync-core-policy.sh", "utf8");
          const project = source.indexOf("node ./project-core-policy.mjs");
          const check = source.indexOf("headscale policy check");
          const publish = source.indexOf('mv -f "$candidate_policy" "$active_policy"');
          const reload = source.indexOf("docker compose kill -s HUP headscale");
          if (!(project >= 0 && project < check && check < publish && publish < reload)) {
            throw new Error("policy sync must project -> validate -> publish -> reload");
          }
          NODE
      - name: Validate compose
        working-directory: fdn-network-coordinator
        run: docker compose config --quiet
      - name: Validate Headscale 0.29.5 config
        working-directory: fdn-network-coordinator
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/runtime/config.yaml:/etc/headscale/config.yaml:ro" \
            -v "$PWD/runtime:/etc/headscale/fdn-runtime:ro" \
            docker.io/headscale/headscale:0.29.5 \
            configtest
      - name: Validate generated projected policy with Headscale 0.29.5
        working-directory: fdn-network-coordinator
        shell: bash
        run: |
          set -euo pipefail
          cp runtime/projected-policy.hujson runtime/policy.hujson
          chmod 600 runtime/policy.hujson
          docker run --rm \
            -v "$PWD/runtime/config.yaml:/etc/headscale/config.yaml:ro" \
            -v "$PWD/runtime:/etc/headscale/fdn-runtime:ro" \
            docker.io/headscale/headscale:0.29.5 \
            configtest
      - name: Validate Headscale enrollment key mint owner
        working-directory: fdn-network-coordinator
        shell: bash
        run: |
          set -euo pipefail
          bash -n ./mint-enrollment-key.sh
          node --input-type=module - <<'NODE'
          import { readFile } from "node:fs/promises";
          const source = await readFile("mint-enrollment-key.sh", "utf8");
          const mint = source.indexOf("headscale preauthkeys create");
          if (mint < 0) throw new Error("missing preauth key mint");
          const tail = source.slice(mint, mint + 500);
          if (tail.includes("--reusable") || tail.includes("--ephemeral")) {
            throw new Error("enrollment key must be single-use and persistent-node");
          }
          for (const required of [
            'headscale users list --name "$cell_id" --output json',
            'headscale users create "$cell_id"',
            '--user "$user_id"',
            '--expiration "${ttl_seconds}s"',
          ]) {
            if (!source.includes(required)) throw new Error(`missing mint invariant: ${required}`);
          }
          NODE

          cp policy.hujson runtime/policy.hujson
          chmod 600 runtime/policy.hujson
          docker compose up -d headscale
          trap 'docker compose down -v >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if docker compose exec -T headscale headscale health >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker compose logs headscale
              exit 1
            fi
            sleep 1
          done

          cell_id="cell-fdn-ci-enrollment"
          key="$(
            FABUSHI_FDN_CELL_ID="$cell_id"             FABUSHI_FDN_ENROLLMENT_TTL_SECONDS=120             bash ./mint-enrollment-key.sh
          )"
          test -n "$key"
          test "${#key}" -le 512
          if [[ "$key" =~ [[:space:]] ]]; then
            exit 1
          fi

          users_json="$(docker compose exec -T headscale headscale users list --name "$cell_id" --output json)"
          preauth_json="$(docker compose exec -T headscale headscale preauthkeys list --output json)"
          CELL_ID="$cell_id" USERS_JSON="$users_json" PREAUTH_JSON="$preauth_json" node --input-type=module - <<'NODE'
          const normalize = (raw, property) => {
            const value = JSON.parse(raw);
            if (Array.isArray(value)) return value;
            if (Array.isArray(value?.[property])) return value[property];
            return [];
          };
          const users = normalize(process.env.USERS_JSON, "users")
            .filter((row) => row?.name === process.env.CELL_ID);
          if (users.length !== 1) throw new Error("opaque Headscale user must resolve exactly once");
          const id = String(users[0].id ?? "");
          if (!/^[1-9][0-9]*$/.test(id)) throw new Error("opaque user must have numeric 0.29.5 id");

          const keys = normalize(process.env.PREAUTH_JSON, "preAuthKeys");
          const owned = keys.filter((row) => {
            const owner = row?.user;
            return owner && String(owner.id ?? "") === id;
          });
          if (owned.length !== 1) throw new Error("expected exactly one CI enrollment key");
          // Headscale 0.29.5 uses encoding/json over generated proto structs.
          // Default false proto3 booleans carry json:",omitempty", so absence is
          // the pinned version's normal representation of false.
          if (owned[0].reusable === true) throw new Error("enrollment key must not be reusable");
          if (owned[0].ephemeral === true) throw new Error("enrollment key must not be ephemeral");
          if (owned[0].used === true) throw new Error("fresh enrollment key must be unused");
          if (!owned[0].expiration) throw new Error("enrollment key must expire");
          NODE

          second_users_json="$(docker compose exec -T headscale headscale users list --name "$cell_id" --output json)"
          test "$second_users_json" = "$users_json"
          unset key users_json preauth_json second_users_json
          docker compose down -v
          trap - EXIT
      - name: Record coordinator provenance
        shell: bash
        run: |
          {
            echo "Backend SHA: $(git rev-parse HEAD)"
            echo "Headscale: 0.29.5"
            echo "Policy default: deny-all grants"
            echo "Embedded DERP verify_clients: true"
          } >> "$GITHUB_STEP_SUMMARY"
