name: Unified Extension Registry CI

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/specs/unified-extension-registry-v1.md"
      - "ai-backend/src/extension_registry.js"
      - "ai-backend/src/extension_publisher_store.js"
      - "ai-backend/src/account_sync_store.js"
      - "ai-backend/src/miniapp_marketplace_http.js"
      - "ai-backend/test/extension_registry.test.js"
      - "ai-backend/test/extension_publisher_store.test.js"
      - "ai-backend/test/account_sync_store.test.js"
      - "ai-backend/test/miniapp_marketplace.test.js"
      - "ai-backend/test/miniapp_marketplace_http.test.js"
      - "ai-backend/package.json"
      - ".github/workflows/unified-extension-registry-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension-registry-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-backend
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ai-backend/package-lock.json
      - run: npm ci --prefer-offline --no-audit --no-fund
      - name: Validate backend syntax
        run: npm run check
      - name: Verify unified registry and existing marketplace contracts
        run: node --test test/extension_registry.test.js test/extension_publisher_store.test.js test/account_sync_store.test.js test/miniapp_marketplace.test.js test/miniapp_marketplace_http.test.js
      - name: Bind evidence to exact source
        run: git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
