name: Sign Reviewed Global Dandelion Package
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  signed-package:
    # GitHub hides draft releases from read-only tokens. This protected
    # canonical-main job requires same-repository draft-maintainer access.
    # It does not perform release publication or change repository content.
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Require canonical main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download exact successful reviewed preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Private source artifacts cannot be read by a different repo's job
          # token. Admin transfers the exact hashed archive to an unpublished
          # same-repository draft; no cross-repository personal token is stored.
          gh release download dandelion-preparation-fce746b --repo bhrumom/fabushi-backend --pattern preparation.zip
      - name: Install signature verifier
        run: python3 -m pip install cryptography==46.0.3
      - name: Verify resources, sign through production, verify pinned public key
        env:
          FABUSHI_MARKETPLACE_REVIEW_TOKEN: ${{ secrets.FABUSHI_MARKETPLACE_REVIEW_TOKEN }}
        run: python3 .github/scripts/deliver-dandelion-package.py
      - uses: actions/upload-artifact@v4
        with:
          name: global-dandelion-signed-delivery-${{ github.sha }}
          path: signed-delivery
