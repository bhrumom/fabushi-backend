name: Isolated CI Account Factory
on:
  pull_request:
    branches: [main]
    paths: ['ci/account-factory/**', 'docs/specs/isolated-ci-account-factory.md', '.github/workflows/ci-account-factory*.yml']
  push:
    branches: [main, codex/isolated-ci-account-factory]
    paths: ['ci/account-factory/**', 'docs/specs/isolated-ci-account-factory.md', '.github/workflows/ci-account-factory*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify adversarial factory and canonical-auth contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_SHA"
          node --check ci/account-factory/cloud/cancel-probe.mjs
          mkdir -p evidence
          node --test --test-reporter=tap ci/account-factory/*.test.mjs | tee evidence/contracts.tap
          printf '{"kind":"contract-tests","sourceSha":"%s","runId":"%s","runAttempt":"%s","exitCode":0,"liveAccountLifecycle":"NOT_VERIFIED"}\n' "$EXACT_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > evidence/source.json
      - name: Bundle actual Cloudflare factory runtime without cloud credentials
        env:
          CORE_SHA: c7d0e24b7561c6f5d1bb3c0e975f599643252504
        run: |
          npm install --prefix "$RUNNER_TEMP/cloud-tools" --no-audit --no-fund wrangler@4.151.0
          node ci/account-factory/cloud/prepare.mjs
          node ci/account-factory/cloud/workerd-probe.mjs
          "$RUNNER_TEMP/cloud-tools/node_modules/.bin/wrangler" deploy --dry-run --config "$RUNNER_TEMP/cloud-accounts/factory.json" --outdir "$RUNNER_TEMP/cloud-factory-bundle"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: account-factory-contracts-${{ github.sha }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
  result:
    name: Account Factory result
    if: always()
    needs: [contracts]
    runs-on: ubuntu-24.04
    steps:
      - name: Require executed contracts
        env:
          CONTRACT_RESULT: ${{ needs.contracts.result }}
        run: test "$CONTRACT_RESULT" = success
